function tile(c1,c2,c3,wall){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,16,16);

else{for(let i=0;i<9;i++){x.fillStyle=Math.random()<.5?c2:c3;x.fillRect(Math.random()*15|0,Math.random()*15|0,1+(Math.random()*2|0),1)}

const BI=[[['#2a2236','#332a44','#1e1829'],['#4a3b63','#2b2140','#6a5890']],[['#2b2b30','#34343a','#1c1c20'],['#55555f','#2e2e36','#75757f']],[['#1d2f3a','#27404d','#14222b'],['#2e5a6e','#1a3644','#4fb0d8']],[['#3a2e22','#4a3a2a','#271e15'],['#5e4630','#35261a','#80623f']],[['#2a1626','#3a1f35','#190d17'],['#5a2a50','#2f1229','#8a3c7a']]];
function setBi(b){const f=BI[b][0],w=BI[b][1];TF=[0,1,2,3].map(()=>tile(f[0],f[1],f[2]));TW=tile(w[0],w[1],w[2],1)}
const DF=[{hp:.7,dm:.7,n:0,g:.8},{hp:1,dm:1,n:0,g:1},{hp:1.4,dm:1.3,n:1,g:1.3},{hp:2,dm:1.7,n:2,g:1.7}];
const SC=[[0,3,7,10],[0,2,5,9],[0,4,7,11],[0,1,5,8],[0,3,6,9]];let mt,mi=0;
function mus(b){clearInterval(mt);mt=setInterval(()=>{if(state=='menu'||state=='dead')return;const f=110*Math.pow(2,(SC[b][mi%4]+(mi%8<4?0:3))/12);if(mi%2==0)snd(f,.35,'triangle',.025);if(mi%4==2)snd(f*2,.15,'square',.012);mi++},240+b*12)}

// ---- state
const W=320,H=176,cv=$('g'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let P,E=[],B=[],I=[],F=[],N=[],cur,rc=document.createElement('canvas'),run,state='menu',shake=0,keys={},joy={x:0,y:0},btn={a:0,d:0,s:0},win=0;rc.width=W;rc.height=H;
const C=[{hp:0,dm:1,sp:1,rg:0},{hp:-25,dm:.8,sp:1.15,rg:1},{hp:-30,dm:1.3,sp:1,rg:2}];let PB=[],MAP=[];const RC=['#c8c8d0','#4fb0d8','#b06af0','#f0a030'],SL=['w','a','r'];
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function gen(){const g={},k=(x,y)=>x+','+y;const s={x:2,y:2,d:0,doors:{}};g[k(2,2)]=s;const l=[s],N_=7+(Math.random()*3|0);let q=0;const ds=[[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']];
while(l.length<N_&&q++<300){const b=l[Math.random()*l.length|0],[dx,dy,a,o]=ds[Math.random()*4|0],nx=b.x+dx,ny=b.y+dy;if(nx<0||ny<0||nx>4||ny>3||g[k(nx,ny)])continue;const r={x:nx,y:ny,d:b.d+1,doors:{}};g[k(nx,ny)]=r;l.push(r);b.doors[a]=r;r.doors[o]=b}
l.forEach(r=>{r.cleared=0;r.seen=0});s.cleared=1;MAP=l;l.reduce((a,b)=>b.d>a.d?b:a).boss=1;l.forEach(r=>{if(!r.boss&&r.d>0&&Math.random()<.3){r.ev=1+(Math.random()*4|0);r.cleared=1}});return s}
function bake(){const x=rc.getContext('2d'),d=cur.doors,o=cur.cleared;for(let cy=0;cy<11;cy++)for(let cx=0;cx<20;cx++){const wall=cx==0||cy==0||cx==19||cy==10;let img;
if(!wall)img=(cur.boss?TB:TF)[(cx*7+cy*3)&3];else{const dc=(cy==0&&d.n&&(cx==9||cx==10))||(cy==10&&d.s&&(cx==9||cx==10))||(cx==0&&d.w&&cy==5)||(cx==19&&d.e&&cy==5);img=dc?(o?TF[0]:TD):(cur.boss?TWB:TW)}x.drawImage(img,cx*16,cy*16)}}
function enter(r){cur=r;r.seen=1;E=[];B=[];PB=[];I=I.filter(i=>Math.abs(i.x-P.x)<400);if(!r.cleared){const m=(1+.1*run.rooms+.45*run.fl)*DF[S.df].hp;if(r.boss)E.push({t:'bo',x:160,y:60,hp:380*m,mh:380*m,r:12,sp:0.6,dm:16*DF[S.df].dm*(1+.15*run.fl),xp:60,cd:0,st:0,tm:2,fl:0,kx:0,ky:0,a:0});
else{const c=3+Math.min(4,run.rooms>>1)+(Math.random()*2|0)+DF[S.df].n;for(let i=0;i<c;i++){const ty=['sl','sl','bt','sk','sk'][Math.random()*5|0];let x,y;do{x=rnd(40,280);y=rnd(40,136)}while(Math.hypot(x-P.x,y-P.y)<80);
const z={sl:[26,6,30,7,8],bt:[12,5,72,5,6],sk:[20,5,34,6,10]}[ty];E.push({t:ty,x,y,hp:z[0]*m,mh:z[0]*m,r:z[1],sp:z[2],dm:z[3]*(1+.05*run.rooms+.15*run.fl)*DF[S.df].dm,xp:z[4],cd:0,tm:rnd(0,2),sp0:.6,fl:0,kx:0,ky:0,a:rnd(0,6)});if(run.rooms>0&&Math.random()<.18+.08*S.df){const z=E[E.length-1];z.el=1+(Math.random()*3|0);z.hp*=2.5;z.mh=z.hp;z.dm*=1.4;z.xp*=3;z.r+=1;if(z.el==1)z.sp*=1.6}}}}bake();if(r.ev&&!r.done)ev(r)}

$('menu').style.display=$('dd').style.display=$('lv').style.display='none';$('hud').style.display='flex';$('ctl').style.display='block'}
function hurtE(e,d,kx,ky){const c=Math.random()<P.cr;if(c)d*=2;e.hp-=d;e.fl=.1;e.kx=kx*(e.t=='bo'?30:130);e.ky=ky*(e.t=='bo'?30:130);N.push({x:e.x,y:e.y-8,v:n(d),l:.6,c:c?'#f0c24a':'#fff'});snd(c?500:300,.07,'square',.05,-120);shake=Math.max(shake,c?2:1);burst(e.x,e.y,4,'#d9435a')}
function burst(x,y,c,col){if(F.length>220)return;for(let i=0;i<c;i++){const a=rnd(0,6.3),s=rnd(30,90);F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.2,.4),c:col})}}
